services:
  postgres:
    image: postgres:17-alpine
    container_name: epic-postgres
    environment:
      POSTGRES_USER: epic
      POSTGRES_PASSWORD: epic
      POSTGRES_DB: epic
    ports:
      - "5434:5432"
    volumes:
      - epic-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U epic -d epic"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  epic-pgdata:
