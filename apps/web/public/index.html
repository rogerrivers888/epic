<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <title>Epic</title>
    <!-- viewport-fit=cover + safe-area insets: the installed web app draws under the notch (research §2) -->
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1.00001, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!--
      `black-translucent` is what lets the app paint *under* the clock, the
      signal and the battery instead of iOS reserving a white strip above it
      (owner, 6 Sep 2026: "That should all be map, and that is achievable. You
      can see Airbnb do it").

      It applies to the whole app, so every screen that is not full-bleed adds
      `env(safe-area-inset-top)` back on for itself (App.tsx `Edges`) — the
      wordmark must not end up under the clock. It only takes effect in the
      installed app; in a browser tab the status bar belongs to the browser and
      nothing can be drawn under it.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Epic" />
    <meta name="theme-color" content="#C8F542" />
    <!-- Type from the Epic pack §05: Archivo, one family, three weights — the
         wordmark is the same face at 800, so there is no second font to load. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&display=swap" />
    <link rel="manifest" href="/manifest.json" />
    <!-- One address for the site, so a `www.` or a Railway hostname that gets
         crawled before the redirect does not become a second copy of it. -->
    <link rel="canonical" href="https://epic.day/" />
    <meta property="og:url" content="https://epic.day/" />
    <meta property="og:site_name" content="Epic" />
    <meta property="og:title" content="Epic — seize the day" />
    <meta property="og:description" content="Epic finds what's worth doing near you today and gets you there." />
    <meta property="og:image" content="https://epic.day/favicon-512.png" />
    <meta property="og:type" content="website" />
    <meta name="description" content="Epic finds what's worth doing near you today and gets you there." />
    <!-- Chrome tab / bookmarks: .ico for older UAs, .svg for modern; 180px for the iOS home screen (docs/brand).
         The tab icon is the handoff's own art: a full-bleed lime tile with the ink
         pin and no hole, because at 16px the hole closes up and the mark reads as a
         blob. A bare pin on a transparent ground is explicitly ruled out — it comes
         out looking like the browser's default location marker. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <!-- The dark-tab alternative first: a browser takes the first `icon` whose
         media matches, so the ink tile has to be offered before the lime one. -->
    <link rel="icon" href="/favicon-dark.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <style>
      /*
        The safe area, once, in one place.

        `env(safe-area-inset-*)` is read here and nowhere else. Everything in the
        app asks for these variables instead, which makes the insets a single
        source of truth — and, as importantly, something a test can override.
        The bug this fixes was invisible for four attempts because
        react-native-web's SafeAreaView builds its own `env(...)` string at
        runtime out of two halves, so it never appears in the bundle to be found
        or substituted, and `env()` is nought in a headless browser. It was
        adding a second full inset on a real phone and only on a real phone.
      */
      :root { --epic-sat: env(safe-area-inset-top); --epic-sab: env(safe-area-inset-bottom); }
      html, body, #root { height: 100%; }
      body { margin: 0; overflow: hidden; background: #FFFDF9; -webkit-text-size-adjust: 100%; }
      /* Archivo everywhere; the odd monospace value marks itself with data-font */
      #root *:not(svg):not(svg *):not([data-font]) { font-family: Archivo, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      /*
        The app is exactly as tall as the screen actually is.

        `100vh` is the *large* viewport — the height with the browser bars
        retracted — so the bottom of the app is cut off while they are showing.
        `-webkit-fill-available` is the opposite mistake: it reports the *small*
        viewport and keeps reporting it after the bars retract, which leaves the
        app short and a band of its own background below the tab bar (owner,
        7 Sep 2026: "look at the amount of dead space at the top and bottom").

        `100dvh` is the one that means "however tall it is right now", and it
        updates as the bars come and go. The two before it are the fallback for
        anything that does not know it; the last one a browser understands wins.
      */
      #root { display: flex; height: 100vh; height: -webkit-fill-available; height: 100dvh; }
    </style>
      <style>
      :root { --epic-bg: #FFFDF9; --epic-surface: #FFFDF9; --epic-ink: #201E1D; --epic-headerBg: #C8F542; color-scheme: light; }
      body { background: var(--epic-bg); }
      [data-theme="dark"] .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(0.86) contrast(0.9); }
      [data-theme="dark"] .leaflet-container { background: #201E1D; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!--
      The installed app has to open with no signal (owner, 4 Sep 2026: "sometimes,
      often, users will be offline or not have signal"). The worker caches the
      app itself; the household's data is kept separately in IndexedDB by
      src/offline/cache.ts, under the licence rules in src/offline/policy.ts.
      Registered after load so it never competes with the first paint.
    -->
    <script>
      if ('serviceWorker' in navigator && location.protocol !== 'file:') {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () { /* no offline shell; the app still works online */ });
        });
      }
    </script>
  </body>
</html>
